name: Publish NextStep Study (N5–N1)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'exams/**'
      - '.nojekyll'
      - 'N1/**'
      - 'N2/**'
      - 'N3/**'
      - 'N4/**'
      - 'N5/**'
      - '.github/workflows/deploy-site.yml'
      - 'scripts/test-n2.cjs'
      - 'scripts/build-social-preview.py'
      - 'scripts/test-social-preview.py'
      - 'scripts/test-responsive.cjs'
      - 'scripts/legacy-responsive.css'
      - 'scripts/legacy-responsive.js'
      - 'scripts/n3-responsive.css'
      - 'scripts/polish-deployed-site.py'
      - 'scripts/test-all-readers.cjs'
  workflow_dispatch:

concurrency:
  group: nextstep-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public reading material
        uses: actions/checkout@v4

      - name: Validate all five readers
        run: |
          set -eu
          for page in index.html N1/index.html N2/index.html N3/index.html N4/index.html N5/index.html; do
            test -s "$page" || { echo "Missing: $page"; exit 1; }
          done
          node scripts/test-n2.cjs
          test -s exams/index.html
          test -s exams/app.js
          test -s exams/full-papers.js
          node --check exams/app.js
          node --check exams/full-papers.js

      - name: Create a reader-only publishing folder
        run: |
          set -eu
          mkdir -p public-site
          cp index.html public-site/
          cp manifest.webmanifest sw.js public-site/
          mkdir -p public-site/icons
          cp icons/icon.svg public-site/icons/
          cp -R exams public-site/
          cp .nojekyll public-site/
          for level in N1 N2 N3 N4 N5; do
            cp -R "$level" public-site/
          done
          test -s public-site/N2/quiz.html
          test -s public-site/N1/data/vocab.json
          # Exclude maintenance/batch/source-attribution documents from the deployed navigation,
          # but keep license notices required by upstream datasets.
          rm -f public-site/N1/Download_N1_Data.ps1 public-site/N1/GET_REAL_N1_DATA.bat

      - name: Apply responsive N3–N5 reader improvements without touching lesson data
        run: python scripts/polish-deployed-site.py public-site

      - name: Set up Python for social cover generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image rendering dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Render six social sharing cover images and inject OG tags
        run: python scripts/build-social-preview.py public-site

      - name: Validate Facebook, WhatsApp and X preview images
        run: python scripts/test-social-preview.py public-site

      - name: Install browser testing dependency
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1

      - name: Verify N1 and N2 phone/tablet/desktop readability in Chromium
        run: node scripts/test-responsive.cjs public-site

      - name: Verify all five books, study tables and navigation on mobile devices
        run: node scripts/test-all-readers.cjs public-site

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
