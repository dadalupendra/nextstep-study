name: Publish NextStep Study (N5–N1)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mobile-app/**'
      - 'study-hub/**'
      - 'community-config.js'
      - 'feedback/**'
      - 'scripts/test-feedback.cjs'
      - 'kanji-compounds.js'
      - 'daily-100.js'
      - 'daily-reminder.js'
      - 'daily-reminder.css'
      - 'scripts/test-daily-reminder.cjs'
      - 'scripts/test-daily-100.cjs'
      - 'scripts/test-daily-100-browser.cjs'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'
      - 'install/**'
      - 'scripts/build-app-icons.py'
      - 'exams/**'
      - '.nojekyll'
      - 'N1/**'
      - 'N2/**'
      - 'N3/**'
      - 'N4/**'
      - 'N5/**'
      - '.github/workflows/deploy-site.yml'
      - 'scripts/test-n2.cjs'
      - 'scripts/build-social-preview.py'
      - 'scripts/test-social-preview.py'
      - 'scripts/test-responsive.cjs'
      - 'scripts/legacy-responsive.css'
      - 'scripts/legacy-responsive.js'
      - 'scripts/n3-responsive.css'
      - 'scripts/polish-deployed-site.py'
      - 'scripts/test-all-readers.cjs'
      - 'scripts/test-exams.cjs'
      - 'scripts/test-exam-studio.cjs'
      - 'scripts/test-master-books.cjs'
      - 'scripts/test-kanji-compounds.cjs'
      - 'scripts/fetch-n3-vocab.py'
  workflow_dispatch:

concurrency:
  group: nextstep-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public reading material
        uses: actions/checkout@v4

      - name: Validate all five readers
        run: |
          set -eu
          for page in index.html N1/index.html N2/index.html N3/index.html N4/index.html N5/index.html; do
            test -s "$page" || { echo "Missing: $page"; exit 1; }
          done
          node scripts/test-n2.cjs
          for level in N2 N3 N4 N5; do
            test -s "$level/master.html"
            test -s "$level/master.js"
            test -s "$level/data/kanji.json"
            test -s "$level/data/grammar.json"
            test -s "$level/THIRD-PARTY-NOTICE.txt"
            node --check "$level/master.js"
          done
          test -s N5/data/vocab.json
          test -s N4/data/vocab.json
          test -s exams/index.html
          test -s exams/app.js
          test -s exams/full-papers.js
          test -s exams/reading-stories.js
          test -s exams/section-content.js
          node --check exams/reading-stories.js
          node --check exams/section-content.js
          node --check exams/app.js
          node --check exams/full-papers.js
          node --check exams/studio.js
          node --check daily-100.js
          node --check daily-reminder.js
          node --check community-config.js
          node --check feedback/feedback.js
          node --check feedback/feedback-upgrade.js
          node --check feedback/feedback-buttons.js
          node --check feedback/admin/admin.js
          python3 -m py_compile scripts/inject-feedback-buttons.py
          test -s feedback/index.html
          test -s feedback/feedback.css
          test -s daily-reminder.css
          test -s exams/studio.css

      - name: Create a reader-only publishing folder
        run: |
          set -eu
          mkdir -p public-site
          cp index.html kanji-compounds.js daily-100.js daily-reminder.js daily-reminder.css community-config.js public-site/
          node --check kanji-compounds.js
          cp manifest.webmanifest sw.js public-site/
          mkdir -p public-site/icons
          cp icons/icon.svg public-site/icons/
          cp -R install public-site/
          cp -R mobile-app study-hub public-site/
          test -s public-site/mobile-app/index.html
          test -s public-site/study-hub/index.html
          mkdir -p public-site/feedback/admin
          cp feedback/index.html feedback/feedback.css feedback/feedback.js feedback/feedback-upgrade.js feedback/feedback-buttons.js public-site/feedback/
          cp feedback/admin/index.html feedback/admin/admin.js public-site/feedback/admin/
          cp -R exams public-site/
          cp .nojekyll public-site/
          for level in N1 N2 N3 N4 N5; do
            cp -R "$level" public-site/
          done
          test -s public-site/N2/quiz.html
          test -s public-site/N1/data/vocab.json
          # Exclude maintenance/batch/source-attribution documents from the deployed navigation,
          # but keep license notices required by upstream datasets.
          rm -f public-site/N1/Download_N1_Data.ps1 public-site/N1/GET_REAL_N1_DATA.bat

      - name: Package verified N3 vocabulary for offline-friendly book reading
        run: python3 scripts/fetch-n3-vocab.py public-site/N3/data/vocab.json

      - name: Apply responsive N3–N5 reader improvements without touching lesson data
        run: python scripts/polish-deployed-site.py public-site

      - name: Add context-aware Feedback and Facebook shortcuts without editing lesson data
        run: python3 scripts/inject-feedback-buttons.py public-site

      - name: Set up Python for social cover generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image rendering dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate installable PWA icons for Windows, Android and iOS
        run: |
          python scripts/build-app-icons.py
          cp icons/icon-180.png icons/icon-192.png icons/icon-512.png public-site/icons/
          test -s public-site/icons/icon-192.png
          test -s public-site/icons/icon-512.png

      - name: Render six social sharing cover images and inject OG tags
        run: python scripts/build-social-preview.py public-site

      - name: Validate Facebook, WhatsApp and X preview images
        run: python scripts/test-social-preview.py public-site

      - name: Install browser testing dependency
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1

      - name: Check independent N5–N2 kanji vocabulary master books on mobile
        run: node scripts/test-master-books.cjs public-site

      - name: Verify 100 unique daily questions for N1–N5 where sources are available
        run: node scripts/test-daily-100.cjs public-site

      - name: Test daily challenge navigation and saved progress in mobile browser
        run: node scripts/test-daily-100-browser.cjs public-site

      - name: Test Facebook and GitHub feedback UI and privacy-safe submission flow
        run: node scripts/test-feedback.cjs public-site

      - name: Test opt-in Today’s Challenge reminders and notification click support
        run: node scripts/test-daily-reminder.cjs public-site

      - name: Test clickable Kanji and compound words on N1–N5 readers
        run: node scripts/test-kanji-compounds.cjs public-site

      - name: Test timed one-question exam studio and answer review on every JLPT level
        run: node scripts/test-exam-studio.cjs public-site

      - name: Smoke test N5–N1 JLPT exam practice sections and controls
        run: node scripts/test-exams.cjs public-site

      - name: Verify N1 and N2 phone/tablet/desktop readability in Chromium
        run: node scripts/test-responsive.cjs public-site

      - name: Verify all five books, study tables and navigation on mobile devices
        run: node scripts/test-all-readers.cjs public-site

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
