<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>NextStep Study · Admin Feedback</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081524;color:#f3fbff;font:16px/1.6 system-ui,sans-serif}
main{max-width:980px;margin:auto;padding:26px 16px 80px}a{color:#69e6d2}h1{font-size:clamp(26px,4vw,38px)}
.panel,.entry{padding:18px;margin:16px 0;background:#14324d;border:1px solid #486d88;border-radius:16px}
label{display:grid;gap:6px;max-width:430px;margin:12px 0}
input,button,select{font:inherit;padding:10px 13px;min-height:46px;border-radius:10px}input{color:#10293f;background:#eaf9ff}
button{background:#5be2d0;color:#07293d;border:0;font-weight:750;cursor:pointer}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#status{color:#acf5ea}#entries{display:grid;gap:10px}.entry{overflow-wrap:anywhere}.entry p{white-space:pre-wrap}
.entry small{color:#c6dceb}.entry h3{margin:0 0 8px}[hidden]{display:none!important}</style>
<script defer src="../../community-config.js?v=2"></script><script defer src="admin.js?v=1"></script></head>
<body><main><a href="../">← Feedback Center</a><h1>🔐 Private Feedback Dashboard</h1>
<p>Administrator login required. Submitted feedback is not public.</p><p id="status" role="status" aria-live="polite">Checking setup…</p>
<section id="signin" class="panel" hidden><h2>Administrator sign-in</h2><form id="login-form">
<label for="admin-email">Email <input id="admin-email" type="email" autocomplete="username" required></label>
<label for="admin-password">Password <input id="admin-password" type="password" autocomplete="current-password" required></label>
<button id="login" type="submit">Sign in</button></form></section>
<section id="dashboard" hidden><div class="toolbar"><h2>Feedback</h2><button id="refresh" type="button">Refresh</button><button id="logout" type="button">Sign out</button></div>
<p id="count"></p><div id="entries"></div></section></main></body></html>
