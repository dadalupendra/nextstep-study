<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFF8EE"><meta name="description" content="NextStep Study mobile learning dashboard, planner, flashcards, notes, JLPT and timer"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><title>NextStep Study | Mobile App</title><style>
:root{--ink:#1B1740;--muted:#5B5780;--primary:#4338CA;--deep:#2A2370;--yellow:#FFC93C;--mint:#7EE0B5;--sky:#8FD3FA;--coral:#FF9B85;--cream:#FFF8EE;--card:white;--size:16px}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:400 var(--size)/1.55 Poppins,system-ui,sans-serif}body.dark{--ink:#F6F3FF;--muted:#D0CBE8;--cream:#16132E;--card:#25204B}button,input,textarea,select{font:inherit}button,a.btn{min-height:46px;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #4338CA;outline-offset:2px}button{border:0}main{max-width:800px;margin:auto;padding:18px 18px 116px}header{max-width:800px;margin:auto;display:flex;align-items:center;gap:10px;padding:18px 18px 6px}.avatar{width:48px;height:48px;background:var(--yellow);color:#1B1740;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:24px}.grow{flex:1}.streak{background:var(--coral);color:#1B1740;padding:8px 10px;border-radius:14px;font-size:12px;font-weight:700}h1{font-size:1.55rem;margin:5px 0 15px}h2{font-size:1.2rem;margin:0 0 12px}p{margin:6px 0 12px}.muted,small{color:var(--muted)}.card{background:var(--card);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 8px 20px #100d2820}.hero{background:var(--primary);color:white}.hero small,.hero p{color:white}.row{display:flex;align-items:center;gap:12px}.space{justify-content:space-between}.button,.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 15px;background:var(--primary);color:white;border-radius:17px;font-weight:700;text-decoration:none;margin:3px 3px 3px 0}.button.yellow,.chip.selected{background:var(--yellow);color:#1B1740}.button.ghost,.chip{background:var(--card);border:2px solid #D8D2EE;color:var(--ink)}.chip.selected{border-color:var(--yellow)}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.quick{border-radius:18px;min-height:95px;color:#1B1740;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px}.quick b{font-size:25px}.sky{background:var(--sky)!important;color:#1B1740!important}.mint{background:var(--mint)!important;color:#1B1740!important}.yellowbg{background:var(--yellow)!important;color:#1B1740!important}.coral{background:var(--coral)!important;color:#1B1740!important}.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.subject{padding:14px;border-radius:20px;color:#1B1740;text-align:left;min-height:120px}.subject b{font-size:1.4rem}.bar{height:9px;background:#B5AACF70;border-radius:10px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--primary);border-radius:10px}.ring{height:112px;width:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--yellow) var(--percent),#ffffff55 0);flex:none}.ring span{background:var(--primary);height:89px;width:89px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:700;font-size:23px}.task{display:flex;align-items:center;gap:10px;border-radius:17px;background:var(--card);padding:14px;margin:8px 0;min-height:66px}.task .strip{width:5px;align-self:stretch;border-radius:5px;background:var(--coral)}.pill{background:var(--mint);color:#1B1740;padding:5px 10px;font-size:12px;font-weight:700;border-radius:12px}.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:25px 25px 0 0;box-shadow:0 -5px 18px #14122B12;display:flex;justify-content:center;padding:9px 4px max(10px,env(safe-area-inset-bottom));z-index:20}.tabbar button{background:none;color:var(--muted);flex:1;max-width:125px;min-height:54px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;font-weight:700;gap:3px}.tabbar button b{font-size:22px;padding:0 17px;border-radius:15px;line-height:29px}.tabbar button.active{color:var(--primary)}.tabbar button.active b{background:#E4E1FB}.field{display:grid;gap:6px;margin:11px 0;font-weight:600}.field input,.field select,.field textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid #AAA1D0;border-radius:14px;min-height:48px;padding:11px}.field textarea{min-height:95px}.timer{background:var(--deep);color:white;text-align:center;border-radius:26px;padding:22px}.timer .ring{width:220px;height:220px;margin:25px auto}.timer .ring span{width:182px;height:182px;background:var(--deep);font-size:44px}.timer h2,.timer p{color:white}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tiles>div{border-radius:18px;padding:13px;text-align:center}.tiles b{display:block;font-size:1.6rem}.chart{display:flex;align-items:end;justify-content:space-around;gap:8px;min-height:170px}.chart>div{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px;font-size:12px}.chart i{width:24px;border-radius:8px 8px 0 0;display:block}.answer{display:block;width:100%;text-align:left;border:2px solid #CAC3E7;border-radius:15px;background:var(--card);color:var(--ink);padding:13px;margin:9px 0}.answer.right{border-color:#228458}.answer.wrong{border-color:#DB5544}.flash{min-height:175px;display:grid;place-items:center;text-align:center;font-size:1.8rem;font-weight:700}.hide{display:none!important}.actions{display:flex;gap:6px;flex-wrap:wrap}.notice{background:var(--card);padding:16px;border-radius:18px}.toast{position:fixed;bottom:91px;left:50%;transform:translateX(-50%);background:#25204B;color:white;padding:10px 20px;border-radius:14px;z-index:30;display:none;white-space:nowrap;max-width:95vw}.a{color:var(--primary)}@media(min-width:700px){.grid4{gap:18px}.levels{grid-template-columns:repeat(5,1fr)}}@media(max-width:370px){.quick{font-size:11px}.quick b{font-size:22px}.ring{width:95px;height:95px}.ring span{width:73px;height:73px}}
</style></head><body><header><div class="avatar">N</div><div class="grow"><small id="hello">Namaste 👋</small><div><b>NextStep Student</b></div></div><a class="button yellow" style="margin:0;font-size:12px;padding:9px 12px" href="./learn.html" aria-label="Open JLPT library">📚 JLPT</a><div class="streak" id="streak">🔥 0 days</div></header><main id="main"></main><nav class="tabbar" aria-label="Main navigation"><button data-tab="home"><b>⌂</b><span data-name="home">Home</span></button><button data-tab="study"><b>▣</b><span data-name="study">Study</span></button><button data-tab="planner"><b>▦</b><span data-name="planner">Planner</span></button><button data-tab="stats"><b>▥</b><span data-name="stats">Stats</span></button><button data-tab="profile"><b>◯</b><span data-name="profile">Profile</span></button></nav><div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA'),key='nextstep-mobile-v1',levels=['N5','N4','N3','N2','N1'];const original={settings:{lang:'ne',dark:false,font:16,exam:''},notes:[],tasks:[],cards:[{id:'1',front:'勉強',back:'Study / अध्ययन',step:0,due:today()},{id:'2',front:'時間',back:'Time / समय',step:0,due:today()}],sessions:[],quizzes:[]};let db;try{db={...structuredClone(original),...JSON.parse(localStorage.getItem(key)||'{}')}}catch{db=structuredClone(original)}let tab='home',tool='timer',mode='focus',left=1500,running=false,clock=0,card=0,flipped=false,qn=0,picked=null;const l10n={en:{home:'Home',study:'Study',planner:'Planner',stats:'Stats',profile:'Profile',goal:"Today's goal",quick:'Quick actions',levels:'JLPT levels',next:'Up next',notasks:'No tasks yet. Add your first!',nonotes:'No notes yet, create your first!',finished:'Saved successfully'},ne:{home:'होम',study:'पढाइ',planner:'योजना',stats:'प्रगति',profile:'प्रोफाइल',goal:'आजको लक्ष्य',quick:'छिटो खोल्नुहोस्',levels:'JLPT लेभल',next:'अब गर्ने',notasks:'अझै कुनै काम छैन। पहिलो काम थप्नुहोस्!',nonotes:'नोट छैन। पहिलो नोट बनाउनुहोस्!',finished:'सुरक्षित भयो'}};const t=k=>(l10n[db.settings.lang]||l10n.en)[k]||k,esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),save=()=>{try{localStorage.setItem(key,JSON.stringify(db))}catch{toast('Storage unavailable')}},toast=s=>{const e=$('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2100)},duration=n=>Math.floor(n/60)+'h '+n%60+'m',minutes=()=>db.sessions.filter(s=>s.date===today()).reduce((a,x)=>a+x.min,0),week=()=>Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const date=d.toLocaleDateString('en-CA');return {day:d.toLocaleDateString('en',{weekday:'short'}),min:db.sessions.filter(x=>x.date===date).reduce((a,x)=>a+x.min,0)}}),streak=()=>{const unique=new Set(db.sessions.map(s=>s.date));let n=0,d=new Date();if(!unique.has(today()))d.setDate(d.getDate()-1);while(unique.has(d.toLocaleDateString('en-CA'))){n++;d.setDate(d.getDate()-1)}return n},button=(label,act,cls='')=>'<button class="button '+cls+'" data-act="'+act+'">'+label+'</button>',openLevel=n=>'./learn.html?level='+n,
openDaily=n=>'../daily/?level='+n,
tokyoDay=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter(v=>v.type!=='literal').map(v=>[v.type,v.value]));return p.year+'-'+p.month+'-'+p.day},
dailyLearned=n=>{try{const saved=JSON.parse(localStorage.getItem('nextstep-3d-daily-v1-'+n+'-'+tokyoDay())||'{}');return Math.min(20,Object.keys(saved||{}).filter(k=>saved[k]).length)}catch{return 0}},
panel=(title,body)=>'<section class="card"><h2>'+title+'</h2>'+body+'</section>';
function home(){const min=minutes(),pct=Math.min(100,Math.floor(min/180*100));return '<section class="card" style="margin:0 0 16px"><h2>📚 Your JLPT Learning Library</h2><p>Everything for each level in one place — modern cards, lesson search and translation into 40 languages.</p><a class="button yellow" href="./learn.html">Open JLPT Library →</a></section><section class="card hero"><div class="row"><div class="ring" style="--percent:'+pct+'%"><span>'+pct+'%</span></div><div><small>'+t('goal')+'</small><h2>'+duration(min)+' / 3h</h2><p>180 min focus goal</p></div></div>'+button('▶ '+t('study'),'tool:timer','yellow')+'</section><h2>'+t('quick')+'</h2><div class="grid4">'+[['timer','◷','sky'],['cards','▣','mint'],['notes','✎','yellowbg'],['quiz','✓','coral']].map(([x,icon,color])=>'<button class="quick '+color+'" data-act="tool:'+x+'"><b>'+icon+'</b>'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</div><h2 style="margin-top:20px">'+t('levels')+'</h2><div class="levels">'+levels.map((x,i)=>{const done=dailyLearned(x);return '<button class="subject '+['sky','mint','yellowbg','coral','sky'][i]+'" data-act="daily:'+x+'" aria-label="Open '+x+' daily 3D Kanji and Vocabulary"><b>'+x+'</b><small style="display:block;margin:3px 0 9px;font-weight:700;color:#1B1740">🧊 10 Kanji + 10 Words</small><div class="bar" role="progressbar" aria-valuenow="'+done+'" aria-valuemin="0" aria-valuemax="20" aria-label="'+x+' daily cards learned"><i style="width:"+(done*5)+"%"></i></div><small>3D Daily → '+done+'/20</small></button>'}).join('')+'</div><h2 style="margin-top:20px">'+t('next')+'</h2>'+ (db.tasks.filter(x=>!x.done).length?db.tasks.filter(x=>!x.done).slice(0,3).map(x=>'<div class="task"><span class="strip"></span><div class="grow"><b>'+esc(x.title)+'</b><div><small>'+esc(x.date)+'</small></div></div><span class="pill">'+(x.date<=today()?'Urgent':'Planned')+'</span></div>').join(''):panel(t('notasks'),button('+ Add task','newtask','ghost')))}
function timer(){const max=mode==='focus'?1500:mode==='break'?300:900,p=Math.round((max-left)/max*100);return '<div class="timer"><h2>⏱ Focus Timer</h2><div class="actions" style="justify-content:center">'+[['focus','Focus 25'],['break','Break 5'],['long','Long 15']].map(([k,v])=>'<button class="chip '+(mode===k?'selected':'')+'" data-act="mode:'+k+'">'+v+'</button>').join('')+'</div><div class="ring" style="--percent:'+p+'%"><span id="clock">'+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')+'</span></div><p>One focused session at a time</p><div class="actions" style="justify-content:center">'+button('↺ Reset','reset','ghost')+button(running?'Ⅱ Pause':'▶ Start','toggle','yellow')+'</div><p><small>Distraction blocking is not available in browsers.</small></p></div>'}
function cards(){let due=db.cards.filter(c=>c.due<=today()),x=due[card%due.length];return '<h1>🃏 Flashcards</h1>'+button('+ New card','newcard')+(x?panel('Review '+due.length+' due cards','<div class="flash">'+esc(flipped?x.back:x.front)+'</div><div class="actions">'+(flipped?button('Again','review:again','ghost')+button('Good','review:good')+button('Easy','review:easy','yellow'):button('Flip card','flip'))+'</div>'):panel('All caught up!','No cards due today. Come back tomorrow.'))}
function notes(){return '<h1>📝 Notes</h1>'+button('+ Create note','newnote')+'<label class="field">Search notes<input id="noteSearch" type="search" placeholder="Search your notes and tags"></label><div id="noteList">'+noteList('')+'</div>'}
function noteList(q){let found=db.notes.filter(n=>(n.title+' '+n.body+' '+n.tags+' '+n.folder).toLowerCase().includes(q.toLowerCase()));return found.map(n=>panel(esc(n.title),'<p style="white-space:pre-wrap">'+esc(n.body)+'</p><small>'+esc(n.folder)+' · '+esc(n.tags)+'</small><div>'+button('Delete','removeNote:'+n.id,'ghost')+'</div>')).join('')||panel(t('nonotes'),'')}
const questions=[{q:'毎日、日本語を（　）。',o:['勉強します','勉強しましたか','勉強しないで','勉強するな'],a:0,why:'毎日 shows a habitual action. 勉強します is a polite present/future form. / हरेक दिनको बानीका लागि 勉強します उपयुक्त छ।'},{q:'「大切」の読み方は？',o:['だいきり','たいせつ','おおせつ','だいせつ'],a:1,why:'大切 is read たいせつ and means important. / 大切 को उच्चारण たいせつ हो।'}];function quiz(){const x=questions[qn];return '<h1>📝 Quick JLPT Quiz</h1>'+panel('Question '+(qn+1)+' / '+questions.length,'<h2>'+esc(x.q)+'</h2>'+x.o.map((o,i)=>'<button class="answer '+(picked===null?'':i===x.a?'right':i===picked?'wrong':'')+'" data-act="answer:'+i+'" '+(picked!==null?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+(picked!==null?'<p><b>'+(picked===x.a?'✓ Correct':'✗ Incorrect')+'</b><br>'+esc(x.why)+'</p>'+button(qn===questions.length-1?'Finish':'Next','nextq'):'')+'<p><small>Sample practice; not official JLPT questions.</small></p>')+'<a class="button ghost" href="../exams/">Open all JLPT exam papers ↗</a>'}
function study(){return '<h1>📚 '+t('study')+'</h1><section class="card"><h2>🎓 JLPT N5–N1 · All subjects together</h2><p>Choose a level and find its Kanji, Vocabulary, Grammar, Reading, Listening, Exams and Daily Challenge in one beautiful library.</p><div class="levels">'+levels.map((x,i)=>'<button class="subject '+['sky','mint','yellowbg','coral','sky'][i]+'" data-act="level:'+x+'"><b>'+x+'</b><p>Open all →</p></button>').join('')+'</div></section><h2>🧰 Study tools</h2><div class="actions">'+['timer','cards','notes','quiz'].map(k=>'<button class="chip '+(tool===k?'selected':'')+'" data-act="tool:'+k+'">'+k[0].toUpperCase()+k.slice(1)+'</button>').join('')+'</div><div style="margin-top:14px">'+(tool==='timer'?timer():tool==='cards'?cards():tool==='notes'?notes():quiz())+'</div>'}
function planner(){const exams=db.settings.exam,remain=exams?Math.ceil((new Date(exams+'T12:00:00')-new Date())/86400000):null;return '<h1>📅 '+t('planner')+'</h1>'+panel('Calendar · '+new Date().toLocaleDateString(db.settings.lang==='ne'?'ne-NP':'en',{month:'long',year:'numeric'}),'<div class="chart" style="align-items:center;min-height:70px">MON · TUE · WED · THU · FRI · SAT · SUN</div>')+panel('🎓 Exam countdown','<label class="field">Exam date<input type="date" id="examdate" value="'+esc(exams)+'"></label><p>'+(remain===null?'Choose your exam date':remain>=0?remain+' days left':'Exam date passed')+'</p>'+button('Save date','exam'))+'<h2>Daily tasks</h2>'+button('+ New task','newtask')+(db.tasks.map(x=>'<div class="task"><input aria-label="Mark task complete" type="checkbox" data-task="'+x.id+'" '+(x.done?'checked':'')+' style="width:25px;height:25px"><div class="grow"><b>'+esc(x.title)+'</b><br><small>'+esc(x.date)+'</small></div>'+button('✕','removeTask:'+x.id,'ghost')+'</div>').join('')||panel(t('notasks'),''))}
function stats(){const w=week(),sum=w.reduce((a,x)=>a+x.min,0),max=Math.max(30,...w.map(x=>x.min));return '<h1>📊 '+t('stats')+'</h1><h2>This week, '+duration(sum)+' studied</h2><div class="tiles"><div class="mint"><b>'+streak()+'</b><small>Day streak</small></div><div class="sky"><b>'+db.cards.filter(c=>c.step).length+'</b><small>Cards done</small></div><div class="coral"><b>'+db.quizzes.length+'</b><small>Tests</small></div></div>'+panel('Weekly study','<div class="chart">'+w.map((x,i)=>'<div><span>'+x.min+'m</span><i style="height:'+Math.max(7,Math.round(x.min/max*120))+'px;background:'+['#8FD3FA','#7EE0B5','#FFC93C','#FF9B85','#ADA6F9','#8FD3FA','#7EE0B5'][i]+'"></i><span>'+x.day+'</span></div>').join('')+'</div>')+panel('By activity','Focus: '+duration(db.sessions.reduce((a,x)=>a+x.min,0))+'<div class="bar"><i style="width:'+Math.min(100,sum/600*100)+'%"></i></div>Flashcards reviewed: '+db.cards.filter(c=>c.step).length)+panel('Badges',(streak()>=7?'🏅':'🔒')+' 7 days　'+(db.cards.filter(c=>c.step).length>=100?'🏅':'🔒')+' 100 cards　🔒 Early bird')}
function profile(){return '<h1>⚙️ '+t('profile')+'</h1>'+panel('Settings','<label class="field">Language<select id="lang"><option value="ne" '+(db.settings.lang==='ne'?'selected':'')+'>नेपाली</option><option value="en" '+(db.settings.lang==='en'?'selected':'')+'>English</option></select></label><label class="field">Theme<select id="dark"><option value="false">Light</option><option value="true" '+(db.settings.dark?'selected':'')+'>Dark</option></select></label><label class="field">Text size<select id="font"><option value="14">Small</option><option value="16">Normal</option><option value="18">Large</option><option value="20">Extra large</option></select></label>'+button('Save settings','settings'))+panel('🌍 Translation Settings','<p>Choose from 93 target languages for your JLPT Kanji, Vocabulary and Grammar explanations. Translation runs inside the new JLPT Library.</p><a class="button yellow" href="./learn.html">🌐 Change translation language →</a>')+panel('🔔 Notifications','Browser notifications are optional and require permission. Daily background reminders are not guaranteed.<p>'+button('Allow notifications','notify','ghost')+'</p>')+panel('🔐 Privacy','Notes, cards, plans and progress are stored only in this browser. There is no login or cloud account, and no online account to delete.<div class="actions">'+button('Export my data','export','ghost')+button('Delete local data','delete','yellow')+'</div>')+panel('📚 Existing JLPT study materials',levels.map(n=>'<a class="button ghost" href="'+openLevel(n)+'">'+n+'</a>').join(''))}
function render(){document.body.classList.toggle('dark',db.settings.dark);document.documentElement.style.setProperty('--size',db.settings.font+'px');document.documentElement.lang=db.settings.lang;$('hello').textContent=db.settings.lang==='ne'?'नमस्ते 👋':'Namaste 👋';$('streak').textContent='🔥 '+streak()+' '+(db.settings.lang==='ne'?'दिन':'days');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('[data-name]').forEach(x=>x.textContent=t(x.dataset.name));$('main').innerHTML=tab==='home'?home():tab==='study'?study():tab==='planner'?planner():tab==='stats'?stats():profile();if(tab==='profile'){$('font').value=db.settings.font;$('dark').value=String(db.settings.dark)}}
function action(a){if(a.startsWith('daily:')){const selected=a.split(':')[1];if(!levels.includes(selected))return;try{localStorage.setItem('nextstep-selected-level',selected);const pref=JSON.parse(localStorage.getItem('nextstep-unified-prefs')||'{}');localStorage.setItem('nextstep-unified-prefs',JSON.stringify({...pref,level:selected}))}catch{}location.href=openDaily(selected);return}if(a.startsWith('level:')){location.href=openLevel(a.split(':')[1]);return}if(a.startsWith('tool:')){tab='study';tool=a.split(':')[1];render();return}if(a.startsWith('mode:')){mode=a.split(':')[1];left=mode==='focus'?1500:mode==='break'?300:900;running=false;clearInterval(clock);render();return}if(a==='toggle'){running=!running;if(running){clearInterval(clock);clock=setInterval(tick,1000)}else clearInterval(clock);render();return}if(a==='reset'){running=false;clearInterval(clock);left=mode==='focus'?1500:mode==='break'?300:900;render();return}if(a==='flip'){flipped=true;render();return}if(a.startsWith('review:')){let c=db.cards.filter(x=>x.due<=today())[card];if(c){c.step=a.endsWith('again')?0:c.step+1;let d=new Date();d.setDate(d.getDate()+(a.endsWith('again')?0:a.endsWith('easy')?Math.max(3,c.step*3):Math.max(1,c.step)));c.due=d.toLocaleDateString('en-CA');card=0;flipped=false;save();toast(t('finished'));render()}return}if(a.startsWith('answer:')){picked=Number(a.slice(7));render();return}if(a==='nextq'){if(qn===questions.length-1){db.quizzes.push({date:today()});qn=0;toast('Quiz completed ✓')}else qn++;picked=null;save();render();return}if(a==='exam'){db.settings.exam=$('examdate').value;save();render();return}if(a==='settings'){db.settings.lang=$('lang').value;db.settings.dark=$('dark').value==='true';db.settings.font=Number($('font').value);save();toast(t('finished'));render();return}if(a==='notify'){if('Notification'in window)Notification.requestPermission().then(x=>toast('Permission: '+x));else toast('Not supported');return}if(a==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='nextstep-mobile-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),2000);return}if(a==='delete'){if(confirm('Erase ALL local NextStep Mobile notes, cards, tasks, and progress?')){localStorage.removeItem(key);db=structuredClone(original);render();toast('Local data deleted')}return}if(a.startsWith('removeTask:')){db.tasks=db.tasks.filter(x=>x.id!==a.slice(11));save();render();return}if(a.startsWith('removeNote:')){db.notes=db.notes.filter(x=>x.id!==a.slice(11));save();render();return}if(['newtask','newnote','newcard'].includes(a)){const desc=a==='newtask'?['Task title','Due date YYYY-MM-DD']:a==='newnote'?['Note title','Note body','Folder','Tags']:['Japanese word','Meaning'];const v=desc.map((x,i)=>prompt(x,a==='newtask'&&i===1?today():''));if(v.some(x=>x===null))return;if(!v[0]||!v[0].trim())return toast('Title required');const id=String(Date.now());if(a==='newtask'){if(!/^\d{4}-\d{2}-\d{2}$/.test(v[1]))return toast('Enter YYYY-MM-DD');db.tasks.push({id,title:v[0],date:v[1],done:false})}else if(a==='newnote')db.notes.unshift({id,title:v[0],body:v[1],folder:v[2]||'General',tags:v[3]||''});else db.cards.push({id,front:v[0],back:v[1],due:today(),step:0});save();render();toast(t('finished'))}}
function tick(){if(!running)return;left=Math.max(0,left-1);const el=$('clock');if(el){el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');el.parentElement.style.setProperty('--percent',Math.round((1-left/(mode==='focus'?1500:mode==='break'?300:900))*100)+'%')}if(left===0){clearInterval(clock);running=false;if(mode==='focus'){db.sessions.push({date:today(),min:25});save()}toast('Session complete ✓');render()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();window.scrollTo(0,0);return}const a=e.target.closest('[data-act]');if(a)action(a.dataset.act)});document.addEventListener('input',e=>{if(e.target.id==='noteSearch')$('noteList').innerHTML=noteList(e.target.value)});document.addEventListener('change',e=>{const id=e.target.dataset.task;if(id){let x=db.tasks.find(x=>x.id===id);if(x){x.done=e.target.checked;save();render()}}});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render()})();
</script></body></html>
